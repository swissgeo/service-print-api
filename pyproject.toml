[project]
name = "service-print-api"
version = "0.0.0" # NOTE: the version is not used
description = "The API that handles print requests"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aioboto3~=15.5.0",
    "ecs-logging~=2.2",
    "gevent~=26.5",
    "gunicorn~=26.0",
    "orjson~=3.11",
    "pydantic-settings~=2.13",
    "pyyaml~=6.0",
    "types-aiobotocore[dynamodb,sqs]~=3.4",
    "types-pyyaml~=6.0",
    # OpenTelemetry packages
    "opentelemetry-sdk~=1.41",
    "opentelemetry-exporter-otlp~=1.41",
    "opentelemetry-instrumentation-asgi==0.62b1",
    "opentelemetry-instrumentation-botocore==0.62b1",
    "opentelemetry-instrumentation-fastapi==0.62b1",
    "fastapi[standard]~=0.136",
]

[dependency-groups]
dev = [
    "debugpy",
    "httpx~=0.28",
    "moto[dynamodb,sqs,server]~=5.1",
    "pytest~=9.0",
    "pytest-asyncio~=1.3",
    "pytest-cov~=7.1",
    "pytest-xdist~=3.8",
    "ruff~=0.15",
    "ty~=0.0",
]

[tool.uv]
package = false # Do not install as a package

#===============================================================================
# FastAPI configuration
[tool.fastapi]
entrypoint = "app.main:app"


#===============================================================================
# ty configuration
[tool.ty.environment]
root = ["."]

[tool.ty.src]
exclude = ["app/tests"]

#===============================================================================
# Ruff configuration
[tool.ruff]
src = ["app"]

# Same as Black.
line-length = 100
indent-width = 4

# Assume Python 3.14
target-version = "py314"

#------------------------------------------------------------------------------
# Linting configuration
[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401", # Ignore Any typehint
    "D",      # Ignore pydocstyle
    "EM",     # Ignore flake8-errmsg
    "TRY003", # Ignore long messages in exception constructors
    "FBT001", # Ignore boolean-type-hint-positional-argument
    "FBT002", # Ignore boolean-default-value-positional-argument
    "TD",     # Ignore flake8-todos
    "FIX",    # Ignore fixme comments
    "COM812", # flak8-commas missing-trailing-comma is ignored to avoid conflict with formatter which enforces trailing commas
    # Pydantic and FastAPI consume type annotations at runtime; keeping them
    # inside TYPE_CHECKING blocks causes subtle failures.
    "TC001",
    "TC002",
    "TC003",
]

# Allow fix for all enabled rules (when `--fix`) is provided.
unfixable = []

fixable = ["ALL"]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

#------------------------------------------------------------------------------
# ruff ignore per files
[tool.ruff.lint.per-file-ignores]

"app/tests/**" = [
    "S101",    # Ignore usage of assert statements in tests
    "ANN201",  # Ignore missing return type hints in tests
    "INP001",  # Ignore implicit namespace packages in tests
    "ANN001",  # Ignore missing type hints in tests
    "ARG001",  # Ignore unused function arguments in tests
    "PLR2004", # Ignore magic number in tests
]

"app/*.py" = [
    "INP001", # Ignore implicit namespace packages in root app files
]

#------------------------------------------------------------------------------
# Isort configuration
[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "fastapi",
    "test",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
fastapi = ["fastapi", "pydantic"]
test = ["pytest"]

#===============================================================================
# Pytest configuration
[tool.pytest.ini_options]
pythonpath = ["app"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

#==============================================================================
# Coverage configuration
[tool.coverage.run]
omit = ["*/tests/*", "version.py", "otel.py"]

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:"]
